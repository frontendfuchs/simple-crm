<mat-card>
    <mat-card-content>
        <table class="user-table">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
            </tr>
            @for (user of users(); track user.id) {
                <tr>
                    <td>{{ user.firstName }} {{ user.lastName }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.city }}</td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="2">No users yet</td>
                </tr>
            }
        </table>
    </mat-card-content>
</mat-card>
<button (click)="openDialog()" class="add-user-btn" matFab matTooltip="Add user">
    <mat-icon>add</mat-icon>
</button>
